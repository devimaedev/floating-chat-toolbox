<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 260px; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #111827; }
      .head { background: linear-gradient(135deg, #ae3566, #c2546c); color: #fff; padding: 14px 16px; }
      .head h1 { margin: 0; font-size: 15px; }
      .head p { margin: 4px 0 0; font-size: 12px; opacity: 0.9; }
      .body { padding: 14px 16px; }
      ul { margin: 8px 0 12px; padding-left: 18px; font-size: 12px; color: #374151; line-height: 1.55; }
      button { width: 100%; padding: 10px; border: none; border-radius: 10px; background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; font-weight: 700; cursor: pointer; }
      .hint { font-size: 11px; color: #6b7280; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div class="head">
      <h1>💬 Floating Chat Toolbox</h1>
      <p>5 handy tools in one floating chat</p>
    </div>
    <div class="body">
      <ul>
        <li>Notes / Scratchpad</li>
        <li>Quick Calendar / Reminders</li>
        <li>URL Shortener / QR Generator</li>
        <li>Dark Mode Toggle (per site)</li>
        <li>Page Stats (words, reading time)</li>
      </ul>
      <button id="open">Open on this page</button>
      <div class="hint">Or click the 💬 button in the bottom-right corner.</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
